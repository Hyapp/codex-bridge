name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: node --check proxy.mjs
      - name: Validate example JSON
        run: |
          node -e "JSON.parse(fs.readFileSync('proxy-models.example.json','utf8'))"
          echo "proxy-models.example.json is valid JSON"
      - name: Ensure .env is not committed
        run: |
          if git ls-files .env | grep -q .env; then
            echo "ERROR: .env is tracked by git!"
            exit 1
          fi
          echo ".env is properly ignored"

  smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test
        env:
          PROXY_AUTH_KEY: ${{ secrets.PROXY_AUTH_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$PROXY_AUTH_KEY" ] || [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Skipping smoke test: PROXY_AUTH_KEY and/or DEEPSEEK_API_KEY not set as GitHub Secrets."
            echo "To enable, add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 0
          fi
          export PROXY_AUTH_KEY DEEPSEEK_API_KEY
          node proxy.mjs &
          PROXY_PID=$!
          sleep 2
          ./scripts/smoke.sh
          RESULT=$?
          kill $PROXY_PID 2>/dev/null || true
          exit $RESULT

  check-secrets:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Warn if secrets missing
        env:
          HAS_AUTH: ${{ secrets.PROXY_AUTH_KEY != '' }}
          HAS_DS: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          if [ "$HAS_AUTH" != "true" ] || [ "$HAS_DS" != "true" ]; then
            echo "::warning::CI smoke test requires GitHub Secrets: PROXY_AUTH_KEY and DEEPSEEK_API_KEY"
            echo "::warning::  Add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
          fi
